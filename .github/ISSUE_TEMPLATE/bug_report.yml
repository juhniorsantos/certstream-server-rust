name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `certstream-server-rust --version`, or the Docker image tag
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected and what you saw instead
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Your config.yaml and any CERTSTREAM_* variables, with tokens removed
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines, with `log_level: debug` if you can
      render: text
